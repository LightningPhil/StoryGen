<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="app-container"> 
        <aside class="controls-panel">
            <header class="panel-header">
                <h1>Story Generator</h1>
                <button id="settingsButton" class="settings-icon-button" aria-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l-.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </header>

            <section class="form-section">
                <label for="charactersInput">Characters</label>
                <textarea id="charactersInput" rows="3" placeholder="e.g., a curious fox, a wise owl"></textarea>

                <label for="audienceInput">Target Audience</label>
                <input type="text" id="audienceInput" placeholder="e.g., children aged 5-7">

                <div class="control-group">
                    <label class="group-title">Optional Story Suggestions</label>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="useEngineSuggestionsCheckbox">
                        <label for="useEngineSuggestionsCheckbox" class="checkbox-label">Let Story Engine Decide</label>
                    </div>
                    <label for="userSuggestionsTextarea" class="sr-only">Enter your suggestions here</label>
                    <textarea id="userSuggestionsTextarea" rows="3" placeholder="Plot points, scene ideas..."></textarea>
                </div>

                <div class="control-group">
                    <label class="group-title">Reading Level Adjustment</label>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="enableReadingAgeAdjustmentCheckbox">
                        <label for="enableReadingAgeAdjustmentCheckbox" class="checkbox-label">Adjust Reading Level</label>
                    </div>
                    <div id="readingAgeSliderContainer" class="slider-container"> 
                        <div class="slider-wrapper">
                            <span class="slider-label-min">Simple</span> 
                            <input type="range" id="targetReadingAgeSlider" min="5" max="12" step="1" value="7">
                            <span class="slider-label-max">Advanced</span>
                        </div>
                        <div class="slider-value-display">Target Age: <span id="targetReadingAgeValue">7</span> years old</div>
                    </div>
                </div>

                <label for="craftingFrameworkSelect">Story Crafting Framework</label>
                <select id="craftingFrameworkSelect">
                    <!-- Options will be populated by script.js -->
                </select>
                <div id="frameworkSummary" class="framework-summary">
                    <!-- Summary will appear here -->
                </div>

                <button id="generateButton" class="button-primary">Generate Story</button>
            </section>
        </aside>

        <main class="story-display-panel">
            <!-- Status messages will now be logged into storyOutput -->
            
            <div class="story-header">
                <h2 id="storyTitle"></h2>
                <div id="storyActionsBar" class="story-actions-bar">
                    <button id="copyStoryButton" class="story-action-button" aria-label="Copy story text" title="Copy story">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                    <button id="saveStoryButton" class="story-action-button" aria-label="Save story as text file" title="Save story">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button id="elaborateStoryButton" class="story-action-button" aria-label="Elaborate on story" title="Elaborate story">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                            <line x1="12" y1="13" x2="12" y2="17"></line>
                            <line x1="10" y1="15" x2="14" y2="15"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="storyOutput">Your story will appear here...</div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <!-- Top right 'X' button is removed -->
            <h2>Settings</h2>
            
            <div class="form-row">
                <label for="modalApiKeyInput">Gemini API Key</label>
                <input type="text" id="modalApiKeyInput" placeholder="Enter your Gemini API Key">
            </div>

            <div class="form-row modal-two-col">
                <div class="form-group">
                    <label for="modalModelSelect">Gemini Model</label>
                    <select id="modalModelSelect">
                        <!-- Options will be populated by script.js -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="minApiIntervalInput">Min. API Interval (s)</label>
                    <input type="number" id="minApiIntervalInput" min="0" step="1" value="5">
                </div>
            </div>

            <div class="control-group-modal"> 
                <label class="group-title-modal">Reading Age Slider Limits</label>
                <div class="inline-inputs">
                    <label for="readingAgeMinInput">Min Age:</label>
                    <input type="number" id="readingAgeMinInput" min="3" max="18" step="1">
                    <label for="readingAgeMaxInput">Max Age:</label>
                    <input type="number" id="readingAgeMaxInput" min="3" max="18" step="1">
                </div>
            </div>
            
            <div class="modal-actions">
                <button id="downloadChatLogButton" class="button-secondary">Download Last Session Log</button>
                <div class="modal-main-actions">
                    <button id="cancelSettingsButton" class="button-tertiary">Cancel</button>
                    <button id="saveSettingsButton" class="button-primary">Save & Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./src/script.js" type="module"></script>
</body>
</html>
